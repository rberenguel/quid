<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Quid</title>
    <link rel="stylesheet" href="./fonts/inter.css" />
    <link rel="stylesheet" href="./fonts/monoid.css" />
    <link rel="stylesheet" href="./fonts/iconoir/iconoir.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./media/favicon.ico" type="image/x-icon" />
  </head>
  <body
    class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen p-4"
  >
    <div id="app">
      <div id="loading-screen" class="text-center">
        <h1>Quid</h1>
        <p>Loading word vectors...</p>
        <div class="progress-bar-container">
          <div id="progress-bar" style="width: 0%"></div>
        </div>
        <p id="loading-status">Initializing...</p>
      </div>

      <div id="game-screen" class="hidden">
        <div id="game-screen-top">
          <h2>Quid</h2>
          <p class="subtitle">
            The secret word is the <span id="secret-word-rank"></span>th most
            common.
          </p>

          <form id="guess-form">
            <input
              type="text"
              id="guess-input"
              placeholder="Guess..."
              autocomplete="off"
            />
            <button type="button" id="restart-btn" class="icon-btn">
              <i class="iconoir-refresh-double"></i>
            </button>
          </form>

          <div id="latest-guess-container" class="info-card">
            <p id="hint-text" style="color: var(--color-text-muted)">
              Enter a word to begin.
            </p>
            <div id="latest-guess-info" class="hidden">
              <p id="latest-word"></p>
              <div>
                <div>
                  <p class="label">Similarity</p>
                  <p class="value" id="latest-similarity"></p>
                </div>
                <div>
                  <p class="label">Rank</p>
                  <p class="value guess-rank" id="latest-rank"></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="main-content">
          <div class="content-card">
            <div id="guess-history-header">
              <span>Word</span>
              <span class="text-right">Similarity</span>
              <span class="text-right">Rank</span>
            </div>
            <ul id="guess-history" class="hide-scrollbar"></ul>
          </div>
        </div>

        <div id="virtual-keyboard" class="hidden"></div>
      </div>

      <div id="win-screen" class="hidden text-center">
        <h1>You found it!</h1>
        <p>The secret word was:</p>
        <p id="win-word" class="font-mono"></p>
        <p>
          You found it in
          <span id="win-guesses" style="font-weight: 700; color: white"></span>
          guesses.
        </p>
        <button id="play-again-btn">Play Again</button>
      </div>
    </div>

    <script src="script.js" type="module"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(
            function (registration) {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            },
            function (err) {
              console.log("ServiceWorker registration failed: ", err);
            },
          );
        });
      } else {
        console.info("Service workers not available on this device");
      }
    </script>
  </body>
</html>
